<!doctype html>

<html lang="dv" dir="rtl">

<head>

<meta charset="UTF-8">

<title>Quran Lower Third Control</title>


<style>

body{

background:#111;

color:white;

font-family:Arial;

padding:30px;

}


input,select,button{

width:350px;

padding:12px;

margin:10px;

font-size:18px;

border-radius:10px;

}


button{

border:none;

cursor:pointer;

color:white;

}


.show{

background:#008f50;

}


.hide{

background:#b88920;

}


</style>


</head>


<body>



<h2>
Quran Competition Lower Third
</h2>



<input id="nameInput"
placeholder="ނަން"
dir="rtl">



<select id="categoryInput" dir="rtl">


<option>
6 އަހަރުން ދަށް (އެލް.ކޭ.ޖީ އިން މަތި)
</option>


<option>
8 އަހަރުން ދަށް
</option>


<option>
10 އަހަރުން ދަށް
</option>


<option>
12 އަހަރުން ދަށް
</option>


<option>
14 އަހަރުން ދަށް
</option>


<option>
16 އަހަރުން ދަށް
</option>


<option>
20 އަހަރުން ދަށް
</option>


<option>
20 އަހަރުން މަތި
</option>


</select>


<br>


<button class="show" onclick="showLT()">
SHOW
</button>


<button class="hide" onclick="hideLT()">
HIDE
</button>



<script>


const channel =
new BroadcastChannel("quran_lowerthird");



function showLT(){


channel.postMessage({

show:true,


name:
document.getElementById("nameInput").value,


category:
document.getElementById("categoryInput").value


});


}



function hideLT(){


channel.postMessage({

show:false

});


}


</script>



</body>

</html>
