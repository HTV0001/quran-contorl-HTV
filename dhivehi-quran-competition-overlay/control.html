<!doctype html>

<html lang="dv" dir="rtl">


<head>

<meta charset="UTF-8">

<title>Quran Overlay Control</title>


<style>

body{

font-family:Arial;

background:#111;

color:white;

text-align:center;

padding:30px;

}


input{

width:400px;

padding:15px;

font-size:22px;

margin:10px;

}


button{

padding:15px 40px;

font-size:22px;

cursor:pointer;

}


</style>


</head>



<body>


<h1>
Quran Competition Control
</h1>



<input id="nameInput"
placeholder="ކުރެއްވި ފަރާތްގެ ނަން">



<br>



<input id="categoryInput"
placeholder="ކެޓަގަރީ">



<br>



<button onclick="updateOverlay()">

UPDATE

</button>




<script>


function updateOverlay(){



localStorage.setItem(

"contestantName",

document.getElementById("nameInput").value

);



localStorage.setItem(

"contestantCategory",

document.getElementById("categoryInput").value

);



}



</script>



</body>


</html>
