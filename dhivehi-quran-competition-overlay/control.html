<!doctype html>
<html lang="dv" dir="rtl">


<head>

<meta charset="UTF-8">

<title>Quran Overlay Control</title>


<style>

body{

font-family:Arial;

background:#111;

color:white;

text-align:center;

padding:30px;

}


input, select{

width:400px;

padding:15px;

font-size:22px;

margin:10px;

}


button{

padding:15px 40px;

font-size:22px;

cursor:pointer;

}

</style>


</head>



<body>


<h1>
Quran Competition Control
</h1>



<input id="nameInput" placeholder="ކުރެއްވި ފަރާތްގެ ނަން">



<br>



<select id="categoryInput">


<option>
ކެޓަގަރީ ނަންގައިލާ
</option>


<option>6 އަހަރުން ދަށް (އެލް.ކޭ.ޖީ އިން މަތި)</option>

<option>8 އަހަރުން ދަށް</option>

<option>10 އަހަރުން ދަށް</option>

<option>12 އަހަރުން ދަށް</option>

<option>14 އަހަރުން ދަށް</option>

<option>16 އަހަރުން ދަށް</option>

<option>20 އަހަރުން ދަށް</option>

<option>20 އަހަރުން މަތި</option>


</select>



<br>



<button onclick="updateOverlay()">

UPDATE

</button>




<script>


const channel = new BroadcastChannel("quranOverlay");



function updateOverlay(){


channel.postMessage({


name:

document.getElementById("nameInput").value,


category:

document.getElementById("categoryInput").value



});


}



</script>



</body>


</html>
